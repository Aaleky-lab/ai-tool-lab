<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A practical AI Tool Lab overview.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://aaleky-lab.github.io/ai-tool-lab/tool.html">
  <meta property="og:type" content="article">
  <meta property="og:title" content="AI tool overview | AI Tool Lab">
  <meta property="og:description" content="A practical AI Tool Lab overview.">
  <title>Tool overview | AI Tool Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><nav class="shell nav" aria-label="Main navigation"><a class="brand" href="index.html"><span class="brand-mark">AI</span>Tool Lab</a><div class="nav-links"><a href="index.html#tools">Collection</a><a href="index.html#about">About</a></div></nav></header>
  <main class="shell detail-main">
    <a class="back-link" href="index.html#tools">← Back to the collection</a>
    <section class="detail-hero" id="detail-hero"></section>
    <section class="detail-layout" id="detail-layout"></section>
  </main>
  <footer class="site-footer"><div class="shell footer-row"><a class="brand" href="index.html"><span class="brand-mark">AI</span>Tool Lab</a><p>AI tools, selected with intention. <a href="affiliate-disclosure.html">Affiliate disclosure</a></p></div></footer>
  <script src="tools.js"></script>
  <script>
    const escapeHtml = value => value.replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
    const id = new URLSearchParams(location.search).get('tool');
    const tool = aiTools.find(item => item.id === id) || aiTools[0];
    const rating = '★'.repeat(tool.rating) + '☆'.repeat(5 - tool.rating);
    document.title = `${tool.name} review: who it is best for | AI Tool Lab`;
    const description = `${tool.name}: ${tool.description} See who it is best for, access information and the official website.`;
    document.querySelector('meta[name="description"]').content = description;
    document.querySelector('meta[property="og:title"]').content = document.title;
    document.querySelector('meta[property="og:description"]').content = description;
    document.querySelector('link[rel="canonical"]').href = `https://aaleky-lab.github.io/ai-tool-lab/tool.html?tool=${encodeURIComponent(tool.id)}`;
    document.getElementById('detail-hero').innerHTML = `<div class="tool-monogram">${escapeHtml(tool.short)}</div><div class="eyebrow">${escapeHtml(tool.category)}</div><h1>${escapeHtml(tool.name)}</h1><div class="rating" aria-label="${tool.rating} out of 5 stars">${rating}</div><p class="detail-lead">${escapeHtml(tool.description)}</p>`;
    const outboundRel = tool.affiliate ? 'sponsored noopener noreferrer' : 'noopener noreferrer';
    document.getElementById('detail-layout').innerHTML = `<div><div class="eyebrow">Why it belongs here</div><h2>A focused pick for real creative work.</h2><p>Choose ${escapeHtml(tool.name)} when your project calls for ${escapeHtml(tool.bestFor.toLowerCase())} It is one tool in a wider collection, so use the category and recommendation to decide whether it is the right starting point.</p><a class="primary-button" href="${escapeHtml(tool.url)}" target="_blank" rel="${outboundRel}">Visit ${escapeHtml(tool.name)} <span aria-hidden="true">↗</span></a><p class="guide-updated">Pricing and plan availability can change. Check the provider before purchasing.</p></div><div class="mini-grid"><article class="info-card"><h3>Best for</h3><p>${escapeHtml(tool.bestFor)}</p></article><article class="info-card"><h3>Category</h3><p>${escapeHtml(tool.category)}</p></article><article class="info-card"><h3>Access</h3><p>${escapeHtml(tool.free)}</p></article></div>`;
  </script>
  <script src="analytics.js"></script>
</body>
</html>
